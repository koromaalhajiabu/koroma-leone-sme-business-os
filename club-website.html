<script>
(function(){
'use strict';
const URL='https://nclncqlgnxnijlumznnt.supabase.co',KEY='sb_publishable_iPIsAysPnlvPCAoqntoNRg_dKcSZxKX';

 if(!value)return;
 let node=document.head.querySelector('meta['+kind+'="'+key+'"]');
 if(!node){node=document.createElement('meta');node.setAttribute(kind,key);document.head.appendChild(node);}
 node.setAttribute('content',String(value));

function applyClubSEO(s){

 const description=String(s.seo_description||s.tagline||s.about_text||('Official website of '+(s.club_name||'this football club')+'. Club news, squad information and contact details.')).replace(/\s+/g,' ').trim().slice(0,320);

 canonicalNode.href=canonical.href;
 const imageUrl=safe(s.hero_image_url||s.crest_url);

 setMeta('property','og:type','website');

 const data=await Promise.all(names.map(n=>rows(n,s.business_id).catch(()=>[])));

 const newsCards=news.sort((a,b)=>Number(!!b.is_featured)-Number(!!a.is_featured)).map(n=>card(n.title,esc(n.excerpt||n.body||'')+'<br><small>'+esc(n.category||'Club news')+' · '+esc(date(n.published_at||n.created_at))+'</small>',n.cover_image_url,n.is_featured?'Featured':n.category));
 const playerCards=squad.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(p=>{
  const profile=playerProfileBySquad[p.id];
  const details=esc(p.position||'')+(p.nationality?' · '+esc(p.nationality):'')+'<br>Apps '+Number(p.appearances||0)+' · Goals '+Number(p.goals||0)+' · Assists '+Number(p.assists||0);
  const profileLink=profile?'<p style="margin-top:11px"><a class="btn" href="./football-scouting.html?player='+encodeURIComponent(profile.public_slug)+'">View player scouting profile ↗</a></p>':'';
  return '<article class="card">'+img(p.photo_url,p.full_name)+'<div>'+(p.squad_group?'<span class="badge">'+esc(p.squad_group)+'</span>':'')+'<h3>'+(p.shirt_number?'#'+esc(p.shirt_number)+' ':'')+esc(p.full_name)+'</h3><p>'+details+'</p>'+profileLink+'</div></article>';
 });
 const staffCards=staff.map(p=>card(p.full_name,esc(p.staff_title)+'<br>'+esc(p.biography||''),p.photo_url,'Club staff'));
 const fixtureRows=fixtures.sort((a,b)=>new Date(a.kickoff_at)-new Date(b.kickoff_at)).map(f=>'<tr><td>'+esc(date(f.kickoff_at))+'</td><td>'+esc(f.competition_name||f.fixture_type)+'</td><td>'+esc(f.venue_type)+' · '+esc(f.opponent_name)+'</td><td>'+(f.match_status==='Completed'?esc(f.home_score)+' - '+esc(f.away_score):esc(f.match_status))+'</td></tr>').join('');

 const honourCards=honours.map(x=>card(x.title,esc(x.competition_name||x.honour_type)+' · '+esc(x.season||'')+' · '+esc(x.award_date||''),x.image_url,'Honour'));

 root.innerHTML='<header class="top"><div class="brand">'+img(s.crest_url,s.club_name)+'<div><strong>'+esc(s.club_name)+'</strong><small>'+esc(s.tagline||'OFFICIAL CLUB WEBSITE')+'</small>'+(s.verification_status==='verified'?'<small class="verified-mark" title="Platform review only; not football association accreditation.">✓ KOROMA LEONE TECH VERIFIED</small>':'')+'</div></div><nav class="nav">'+nav+'</nav></header>'+
 '<section class="hero" style="'+hero+'"><div><div class="eyebrow">'+esc(s.city||s.country||'Official Club Website')+(s.founded_year?' · EST. '+s.founded_year:'')+'</div><h1>'+esc(s.club_name)+'</h1><p>'+esc(s.tagline||s.about_text||'Welcome to the official website of '+s.club_name+'.')+'</p><div>'+(s.ticketing_url?'<a class="btn" href="'+esc(safe(s.ticketing_url))+'" target="_blank" rel="noopener">Tickets</a>':'')+(s.shop_url?'<a class="btn alt" href="'+esc(safe(s.shop_url))+'" target="_blank" rel="noopener">Club shop</a>':'')+(s.membership_url?'<a class="btn alt" href="'+esc(safe(s.membership_url))+'" target="_blank" rel="noopener">Membership</a>':'')+(s.whatsapp_phone?'<a class="btn alt" href="https://wa.me/'+esc(String(s.whatsapp_phone).replace(/\\D/g,''))+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</div></div></section><main>'+
 section('about','About the club','Our identity and story','<div class="profile"><p>'+esc(s.about_text||'Club profile coming soon.').replace(/\\n/g,'<br>')+'</p>'+(s.history_text?'<p>'+esc(s.history_text).replace(/\\n/g,'<br>')+'</p>':'')+'<p><strong>Home ground:</strong> '+esc(s.home_ground||'To be announced')+' · <strong>Location:</strong> '+esc(s.city||'')+', '+esc(s.country||'')+'</p></div>')+
 section('news','Latest news','Official updates and announcements',grid(newsCards))+section('squad','First team and academy','Published player profiles',grid(playerCards))+section('staff','Coaching and club staff','Meet the club team',grid(staffCards))+
 section('fixtures','Fixtures and results','Club schedule and match results',fixtureRows?'<div class="table"><table><thead><tr><th>Date</th><th>Competition</th><th>Match</th><th>Score / status</th></tr></thead><tbody>'+fixtureRows+'</tbody></table></div>':'')+
 section('standings','League table','Competition standings',standingRows?'<div class="table"><table><thead><tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF:GA</th><th>Pts</th></tr></thead><tbody>'+standingRows+'</tbody></table></div>':'')+
 section('transfers','Transfers and squad updates','Official announcements',grid(transferCards))+section('gallery','Club gallery','Photos and videos',grid(galleryCards))+section('sponsors','Sponsors and partners','Organisations supporting the club',grid(sponsorCards))+section('events','Academy, trials and events','Club and community activities',grid(eventCards))+section('honours','Honours and history','The club’s achievements',grid(honourCards))+custom+
