<style>
:root{--primary:#075b35;--secondary:#101a2d;--accent:#d5ae5a;--paper:#f5f8f5;--muted:#6c7c71}*{box-sizing:border-box}body{margin:0;color:#172a22;background:var(--paper);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{color:inherit}.top{background:var(--secondary);color:#fff;padding:14px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.brand strong{display:block}.brand small{font-size:10px;color:#d0d7d1;letter-spacing:1px}.nav{display:flex;gap:14px;overflow:auto}.nav a{white-space:nowrap;text-decoration:none;font-size:11px;color:#f2f5f1}.hero{background:linear-gradient(90deg,#07180fdd,#07180f55),var(--primary);background-size:cover;background-position:center;color:white;min-height:350px;padding:65px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:end}.hero>div{max-width:760px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:800}.hero h1{font-size:clamp(35px,6vw,64px);line-height:1.02;margin:10px 0}.hero p{color:#e1e9e2}.btn{display:inline-block;background:var(--accent);color:#192619;padding:10px 15px;border-radius:9px;text-decoration:none;font-weight:800;font-size:12px;margin-right:6px}.btn.alt{background:#fff;color:var(--secondary)}main{max-width:1180px;margin:auto;padding:22px 18px 50px}.section{margin:30px 0}.section h2{font-size:21px;color:var(--secondary);margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card,.profile,.contact{background:#fff;border:1px solid #e2eae3;border-radius:13px;overflow:hidden}.card img{width:100%;height:170px;object-fit:cover;background:#eaf0ea}.card div{padding:13px}.card h3{font-size:14px;margin:0 0 5px}.card p{font-size:12px;color:var(--muted);margin:0;overflow-wrap:anywhere}.badge{display:inline-block;background:#eff7f0;color:var(--primary);font-size:9px;border-radius:20px;padding:4px 8px;margin-bottom:7px}.profile{padding:17px}.profile p{color:#596b60}.table{overflow:auto;background:white;border:1px solid #e2eae3;border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:10px 12px;border-bottom:1px solid #edf1ed;font-size:11px}th{background:#f0f6f1;color:#637569;text-transform:uppercase;font-size:9px}.contact{padding:17px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.contact label{display:grid;gap:5px;font-size:10px;font-weight:800;color:#647368}.contact input,.contact textarea,.contact select{padding:10px;border:1px solid #dce6de;border-radius:8px;font:inherit;font-size:12px}.wide{grid-column:1/-1}.status{font-size:12px;color:var(--primary)}footer{background:var(--secondary);color:#e3e9e3;padding:28px max(18px,calc((100vw - 1180px)/2));font-size:11px}footer p{color:#bdc9be}.error{max-width:700px;margin:50px auto;padding:22px;background:white;border:1px solid #efd6d6;border-radius:12px;color:#913d3d}

</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="app">Loading official club website…</div>
<script>
(function(){
'use strict';
const URL='https://nclncqlgnxnijlumznnt.supabase.co',KEY='sb_publishable_iPIsAysPnlvPCAoqntoNRg_dKcSZxKX';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=v=>{try{const u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(_){return '#'}};
const slug=new URLSearchParams(location.search).get('slug'),root=document.getElementById('app');
if(!slug){root.innerHTML='<div class="error">Club website not found. Open the link supplied by the club.</div>';return}
if(!window.supabase?.createClient){root.innerHTML='<div class="error">Website service unavailable. Refresh when connected.</div>';return}
const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const section=(id,title,desc,body)=>body?'<section class="section" id="'+esc(id)+'"><h2>'+title+'</h2><p>'+desc+'</p>'+body+'</section>':'';
const grid=a=>a.length?'<div class="cards">'+a.join('')+'</div>':'';
const img=(u,a)=>u?'<img loading="lazy" src="'+esc(safe(u))+'" alt="'+esc(a||'Club image')+'">':'';
const card=(t,d,u,b)=>'<article class="card">'+img(u,t)+'<div>'+(b?'<span class="badge">'+esc(b)+'</span>':'')+'<h3>'+esc(t)+'</h3><p>'+d+'</p></div></article>';
const date=v=>v?new Date(v).toLocaleString():'—';
async function rows(t,id){const r=await db.from(t).select('*').eq('business_id',id).eq('is_published',true);if(r.error)throw r.error;return r.data||[]}
async function start(){
 const r=await db.from('football_club_websites').select('*').eq('slug',slug).eq('is_published',true).eq('maintenance_mode',false).maybeSingle();
 if(r.error||!r.data){root.innerHTML='<div class="error">This club website is not available. It may be unpublished or temporarily offline.</div>';return}
 const s=r.data;document.title=s.seo_title||s.club_name;const meta=document.querySelector('meta[name="description"]');if(meta&&s.seo_description)meta.content=s.seo_description;
 document.documentElement.style.setProperty('--primary',s.primary_color||'#075b35');document.documentElement.style.setProperty('--secondary',s.secondary_color||'#101a2d');document.documentElement.style.setProperty('--accent',s.accent_color||'#d5ae5a');
 const names=['football_club_website_pages','football_club_website_news','football_club_website_squad','football_club_website_staff','football_club_website_fixtures','football_club_website_standings','football_club_website_transfers','football_club_website_gallery','football_club_website_sponsors','football_club_website_events','football_club_website_honours'];
 const data=await Promise.all(names.map(n=>rows(n,s.business_id).catch(()=>[])));
 const [pages,news,squad,staff,fixtures,standings,transfers,gallery,sponsors,events,honours]=data;
 const nav=[['about','About'],['news','News'],['squad','Squad'],['fixtures','Fixtures'],['gallery','Gallery'],['contact','Contact']].concat(pages.filter(p=>p.show_in_navigation).map(p=>[p.slug,p.title])).map(x=>'<a href="#'+esc(x[0])+'">'+esc(x[1])+'</a>').join('');
 const hero=s.hero_image_url?'background-image:linear-gradient(90deg,#07180fdd,#07180f55),url("'+esc(safe(s.hero_image_url))+'")':'';
 const custom=pages.map(p=>section(p.slug,esc(p.title),esc(p.summary||''),'<div class="profile"><p>'+esc(p.body||'').replace(/\\n/g,'<br>')+'</p></div>')).join('');
 const newsCards=news.sort((a,b)=>Number(!!b.is_featured)-Number(!!a.is_featured)).map(n=>card(n.title,esc(n.excerpt||n.body||'')+'<br><small>'+esc(n.category||'Club news')+' · '+esc(date(n.published_at||n.created_at))+'</small>',n.cover_image_url,n.is_featured?'Featured':n.category));
 const playerCards=squad.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(p=>card((p.shirt_number?'#'+p.shirt_number+' ':'')+p.full_name,esc(p.position||'')+(p.nationality?' · '+esc(p.nationality):'')+'<br>Apps '+p.appearances+' · Goals '+p.goals+' · Assists '+p.assists,p.photo_url,p.squad_group));
 const staffCards=staff.map(p=>card(p.full_name,esc(p.staff_title)+'<br>'+esc(p.biography||''),p.photo_url,'Club staff'));
 const fixtureRows=fixtures.sort((a,b)=>new Date(a.kickoff_at)-new Date(b.kickoff_at)).map(f=>'<tr><td>'+esc(date(f.kickoff_at))+'</td><td>'+esc(f.competition_name||f.fixture_type)+'</td><td>'+esc(f.venue_type)+' · '+esc(f.opponent_name)+'</td><td>'+(f.match_status==='Completed'?esc(f.home_score)+' - '+esc(f.away_score):esc(f.match_status))+'</td></tr>').join('');
 const standingRows=standings.sort((a,b)=>a.position-b.position).map(x=>'<tr><td>'+x.position+'</td><td>'+esc(x.team_name)+'</td><td>'+x.played+'</td><td>'+x.won+'</td><td>'+x.drawn+'</td><td>'+x.lost+'</td><td>'+x.goals_for+':'+x.goals_against+'</td><td><strong>'+x.points+'</strong></td></tr>').join('');
 const transferCards=transfers.map(x=>card(x.player_name,esc(x.transfer_type)+' · '+esc(x.previous_club||'')+(x.new_club?' → '+esc(x.new_club):'')+'<br>'+esc(x.announcement||''),null,'Transfer'));
 const galleryCards=gallery.map(x=>card(x.title||x.caption||'Club gallery',esc(x.caption||x.category||''),x.asset_url,x.media_type));
 const sponsorCards=sponsors.map(x=>card(x.sponsor_name,esc(x.tier)+(x.website_url?' · <a href="'+esc(safe(x.website_url))+'" target="_blank" rel="noopener">Visit website ↗</a>':''),x.logo_url,'Partner'));
 const eventCards=events.map(x=>card(x.title,esc(x.event_type)+' · '+esc(date(x.start_at))+'<br>'+esc(x.venue||'')+(x.registration_url?' · <a href="'+esc(safe(x.registration_url))+'" target="_blank" rel="noopener">Register ↗</a>':''),x.cover_image_url));
 const honourCards=honours.map(x=>card(x.title,esc(x.competition_name||x.honour_type)+' · '+esc(x.season||'')+' · '+esc(x.award_date||''),x.image_url,'Honour'));
 root.innerHTML='<header class="top"><div class="brand">'+img(s.crest_url,s.club_name)+'<div><strong>'+esc(s.club_name)+'</strong><small>'+esc(s.tagline||'OFFICIAL CLUB WEBSITE')+'</small></div></div><nav class="nav">'+nav+'</nav></header>'+
 '<section class="hero" style="'+hero+'"><div><div class="eyebrow">'+esc(s.city||s.country||'Official Club Website')+(s.founded_year?' · EST. '+s.founded_year:'')+'</div><h1>'+esc(s.club_name)+'</h1><p>'+esc(s.tagline||s.about_text||'Welcome to the official website of '+s.club_name+'.')+'</p><div>'+(s.ticketing_url?'<a class="btn" href="'+esc(safe(s.ticketing_url))+'" target="_blank" rel="noopener">Tickets</a>':'')+(s.shop_url?'<a class="btn alt" href="'+esc(safe(s.shop_url))+'" target="_blank" rel="noopener">Club shop</a>':'')+'</div></div></section><main>'+
 section('about','About the club','Our identity and story','<div class="profile"><p>'+esc(s.about_text||'Club profile coming soon.').replace(/\\n/g,'<br>')+'</p>'+(s.history_text?'<p>'+esc(s.history_text).replace(/\\n/g,'<br>')+'</p>':'')+'<p><strong>Home ground:</strong> '+esc(s.home_ground||'To be announced')+' · <strong>Location:</strong> '+esc(s.city||'')+', '+esc(s.country||'')+'</p></div>')+
 section('news','Latest news','Official updates and announcements',grid(newsCards))+section('squad','First team and academy','Published player profiles',grid(playerCards))+section('staff','Coaching and club staff','Meet the club team',grid(staffCards))+
 section('fixtures','Fixtures and results','Club schedule and match results',fixtureRows?'<div class="table"><table><thead><tr><th>Date</th><th>Competition</th><th>Match</th><th>Score / status</th></tr></thead><tbody>'+fixtureRows+'</tbody></table></div>':'')+
 section('standings','League table','Competition standings',standingRows?'<div class="table"><table><thead><tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF:GA</th><th>Pts</th></tr></thead><tbody>'+standingRows+'</tbody></table></div>':'')+
 section('transfers','Transfers and squad updates','Official announcements',grid(transferCards))+section('gallery','Club gallery','Photos and videos',grid(galleryCards))+section('sponsors','Sponsors and partners','Organisations supporting the club',grid(sponsorCards))+section('events','Academy, trials and events','Club and community activities',grid(eventCards))+section('honours','Honours and history','The club’s achievements',grid(honourCards))+custom+
 section('contact','Contact the club','Send a message to the club','<form class="contact" id="enquiry"><label>Full name<input name="full_name" required minlength="2" maxlength="100"></label><label>Email<input name="email" type="email" maxlength="254"></label><label>Phone<input name="phone" maxlength="40"></label><label>Enquiry type<select name="enquiry_type"><option>General</option><option>Player Trial</option><option>Academy</option><option>Sponsorship</option><option>Ticketing</option><option>Media</option><option>Other</option></select></label><label class="wide">Subject<input name="subject" maxlength="180"></label><label class="wide">Message<textarea name="message" required minlength="10" maxlength="3000"></textarea></label><div class="wide"><button class="btn">Send enquiry</button> <span class="status" id="enquiryStatus"></span></div></form>')+'</main><footer><strong>'+esc(s.club_name)+'</strong><p>'+esc(s.address||s.city||'')+(s.country?' · '+esc(s.country):'')+'</p><p>'+(s.contact_email?'Email: '+esc(s.contact_email)+' · ':'')+(s.contact_phone?'Phone: '+esc(s.contact_phone):'')+'</p><p>Website services by Koroma Leone Tech</p></footer>';
 document.getElementById('enquiry').onsubmit=async e=>{e.preventDefault();const st=document.getElementById('enquiryStatus');st.textContent='Sending…';const f=Object.fromEntries(new FormData(e.target).entries()),z=await db.from('football_club_website_enquiries').insert({...f,business_id:s.business_id});st.textContent=z.error?'Message could not be sent. Please contact the club directly.':'Thank you. Your message has been received.';if(!z.error)e.target.reset();};
}
start().catch(e=>{root.innerHTML='<div class="error">The club website could not be loaded. Refresh or try again later.</div>';console.error(e)});
})();
</script></body></html>
