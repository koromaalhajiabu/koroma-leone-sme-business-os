<!doctype html><html lang="en"><head>
<script src="./i18n.js?v=26" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087a43"><title>Track Delivery | Koroma Leone Tech</title><style>body{margin:0;background:#f3f7f4;color:#183326;font:15px/1.5 system-ui,Arial}header{background:linear-gradient(135deg,#075b35,#0d7544);color:#fff;padding:28px 18px}main{max-width:700px;margin:25px auto;padding:0 15px}.panel{background:#fff;border:1px solid #dfe9e2;border-radius:16px;padding:20px;box-shadow:0 10px 30px #0a4b2810}.muted{color:#718078;font-size:12px}.status{font-size:22px;font-weight:800;text-transform:capitalize;color:#087a43}.event{padding:12px 0;border-bottom:1px solid #edf2ee}.event:last-child{border:0}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #dce7df}button{background:#087a43;color:white;border:0;font-weight:700}</style>  <link rel="stylesheet" href="./motion-2026.css?v=2">
</head><body><header><b>KOROMA LEONE TECH · DELIVERY TRACKING</b><p>Follow your order's delivery progress.</p></header><main><div class="panel"><div id="result">Loading tracking information…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{
  const out=document.getElementById('result');
  const make=(tag,value,className)=>{
    const node=document.createElement(tag);
    if(className)node.className=className;
    node.textContent=String(value==null?'':value);
    return node;
  };
  const cleanStatus=value=>String(value==null?'Unknown':value).replace(/_/g,' ');
  try{
    const sb=supabase.createClient('https://nclncqlgnxnijlumznnt.supabase.co','sb_publishable_iPIsAysPnlvPCAoqntoNRg_dKcSZxKX',{auth:{persistSession:false}});
    const code=new URLSearchParams(location.search).get('code');
    if(!code)throw Error('Tracking code is missing.');
    const {data,error}=await sb.rpc('get_public_delivery_tracking',{p_tracking_code:code});
    if(error)throw error;
    if(!data||data.status!=='success'||!data.tracking)throw Error('We could not find this tracking number.');
    const t=data.tracking;
    out.replaceChildren();
    out.appendChild(make('h2','Order '+(t.order_number||'—')));
    out.appendChild(make('div',cleanStatus(t.delivery_status),'status'));
    const reference=make('p','Tracking reference: '+(t.tracking_code||'—'),'muted');
    out.appendChild(reference);
    const address= document.createElement('p');
    address.appendChild(make('b','Delivery address'));
    address.appendChild(document.createElement('br'));
    address.appendChild(document.createTextNode(String(t.delivery_address||'Not provided')));
    out.appendChild(address);
    const rider=document.createElement('p');
    rider.appendChild(make('b','Rider'));
    rider.appendChild(document.createElement('br'));
    rider.appendChild(document.createTextNode(String(t.rider_name||'Not yet assigned')+(t.rider_phone?' · '+t.rider_phone:'')));
    out.appendChild(rider);
    out.appendChild(make('h3','Delivery updates'));
    const events=Array.isArray(t.events)?t.events:[];
    if(!events.length){
      out.appendChild(make('p','No updates yet.'));
    }else{
      events.forEach(e=>{
        const item=make('div','','event');
        item.appendChild(make('b',cleanStatus(e&&e.status)));
        item.appendChild(make('div',e&&e.at?new Date(e.at).toLocaleString():'','muted'));
        if(e&&e.note)item.appendChild(make('div',e.note));
        out.appendChild(item);
      });
    }
  }catch(e){
    out.textContent=e&&e.message?e.message:String(e);
  }
})();
</script>>  <script src="./motion-2026.js?v=2" defer></script>
</body></html>
